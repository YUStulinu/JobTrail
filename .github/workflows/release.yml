name: Release

# Push a tag like v1.1.0: the jobtrail command is packed with its dependencies for Linux, Windows
# and macOS (pdf-parse needs a native canvas module, different on each). Before anything is
# published, each archive is unpacked outside the repository and checked the way an AI agent uses
# it: a PDF CV is read, and the samples' invented claims are caught.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NAME: jobtrail-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        run: npm ci && npm test
      - name: Package (the command line and its production dependencies)
        run: |
          d="pkg/$NAME"
          mkdir -p "$d"
          cp -r bin lib samples package.json package-lock.json README.md LICENSE "$d/"
          (cd "$d" && npm ci --omit=dev --no-audit --no-fund)
      - name: Check the archive from outside the repository, as an AI agent uses it
        run: |
          cp -r "pkg/$NAME" "$RUNNER_TEMP/$NAME" && cd "$RUNNER_TEMP/$NAME"
          q() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);process.stdout.write(String($1))})"; }
          [ "$(node bin/jobtrail.js cv samples/cv-alex-morgan.pdf | q 'd.sections.length+","+d.warnings.length')" = "3,0" ]
          node bin/jobtrail.js match --cv samples/cv-alex-morgan.pdf --analysis samples/analysis.json --job samples/job-frontend.txt > m.json
          [ "$(q 'd.score' < m.json)" = 61 ]
          [ "$(q 'd.checks.changes.length' < m.json)" = 3 ]
          [ "$(node bin/jobtrail.js letter --cv samples/cv-alex-morgan.pdf --letter samples/letter.txt --analysis samples/analysis.json | q 'd.numbersNotInCv.join()+"|"+d.skillsNotInCv.length')" = "5|2" ]
          echo "PDF read, claims checked, letter flagged"
      - name: Pack
        run: |
          cd pkg
          if [ "$RUNNER_OS" = Windows ]; then 7z a -bd "../$NAME.zip" "$NAME" >/dev/null; else tar -czf "../$NAME.tar.gz" "$NAME"; fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME }}
          path: jobtrail-*.*z*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
